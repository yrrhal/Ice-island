name: Build Android APK

# يعمل تلقائيًا عند كل رفع (push) — يبني نسخة Debug من التطبيق ويرفعها
# كملف قابل للتنزيل من تبويب Actions، دون أي إعداد محلي مطلوب منك.
#
# ملاحظة: هذا يبني نسخة Debug فقط (غير موقّعة لإصدار رسمي). لبناء نسخة
# Release موقّعة جاهزة للنشر الفعلي على Google Play، أضف أسرار التوقيع
# (keystore) إلى GitHub Secrets وعدّل خطوة البناء أدناه — راجع
# docs/PUBLISHING_CHECKLIST.md.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install JS dependencies
        run: npm install

      - name: Ensure Android platform exists
        run: |
          if [ ! -d "android" ]; then
            echo "مجلد android غير موجود — يُنشأ الآن تلقائيًا."
            npx cap add android
          fi

      - name: Sync Capacitor (copies www/ into the native project)
        run: npx cap sync android

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ice-island-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
